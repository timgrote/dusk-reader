<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dusk Reader</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Dusk Reader</h1>
      <p class="subtitle">Private, local-only website dark mode.</p>
      <label class="row" for="enabled">
        <span>Dark mode everywhere</span>
        <input id="enabled" type="checkbox" role="switch">
      </label>
      <label class="row" for="site-enabled">
        <span id="site-label">Dark mode on this site</span>
        <input id="site-enabled" type="checkbox" role="switch">
      </label>
      <p id="site" class="site"></p>
      <p id="restricted" class="note" hidden>This page cannot be modified by browser extensions.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
